name: aegisforge
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports: ['127.0.0.1:5173:5173']
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
      VITE_SECURITY_CONTACT: ${VITE_SECURITY_CONTACT:-}
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
    depends_on:
      api: { condition: service_started }
    networks: [frontend]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      AEGIS_PROFILE: ${AEGIS_PROFILE:-dev}
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:?Run make setup first}@postgres:5432/aegis
      AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD:?Run make setup first}@redis:6379/0
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-INFO}
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [frontend, database, api_broker]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    environment:
      AEGIS_PROFILE: ${AEGIS_PROFILE:-dev}
      AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD:?Run make setup first}@redis:6379/0
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-INFO}
    depends_on:
      redis: { condition: service_healthy }
    networks: [worker_broker]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A aegis_api.worker:app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make setup first}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis_data:/data]
    networks: [api_broker, worker_broker]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: [scanner]
    # Idle foundation container: no daemon, target, scan or API port.
    command: ['sleep', 'infinity']
    network_mode: none
    volumes: [zap_data:/zap/wrk]
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres_data:
  redis_data:
  zap_data:
networks:
  frontend:
  database:
    internal: true
  api_broker:
    internal: true
  worker_broker:
    internal: true
