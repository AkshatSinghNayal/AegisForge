name: aegisforge
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports: ['127.0.0.1:5173:5173']
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
      VITE_SECURITY_CONTACT: ${VITE_SECURITY_CONTACT:-}
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
    depends_on:
      api: { condition: service_started }
    networks: [frontend]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      AEGIS_PROFILE: ${AEGIS_PROFILE:-dev}
      AEGIS_DEMO_MODE: ${AEGIS_DEMO_MODE:-false}
      AEGIS_SCANNER_PROVIDER: ${AEGIS_SCANNER_PROVIDER:-none}
      AEGIS_AI_PROVIDER: ${AEGIS_AI_PROVIDER:-none}
      AEGIS_AI_MODEL: ${AEGIS_AI_MODEL:-gemini-2.5-flash}
      AEGIS_GEMINI_API_KEY: ${AEGIS_GEMINI_API_KEY:-}
      AEGIS_SCAN_COORDINATOR_ENABLED: ${AEGIS_SCAN_COORDINATOR_ENABLED:-true}
      AEGIS_SCAN_CONCURRENCY: ${AEGIS_SCAN_CONCURRENCY:-3}
      AEGIS_SCAN_DAILY_QUOTA: ${AEGIS_SCAN_DAILY_QUOTA:-100}
      AEGIS_SCAN_STAGE_TIMEOUT_SECONDS: ${AEGIS_SCAN_STAGE_TIMEOUT_SECONDS:-30}
      AEGIS_REPORTING_ENABLED: ${AEGIS_REPORTING_ENABLED:-true}
      AEGIS_REPORT_STORAGE: ${AEGIS_REPORT_STORAGE:-local}
      AEGIS_REPORT_ROOT: /var/lib/aegis/reports
      AEGIS_REPORT_SIGNING_KEY: ${AEGIS_REPORT_SIGNING_KEY:-}
      AEGIS_REPORT_BUCKET: ${AEGIS_REPORT_BUCKET:-}
      AEGIS_REPORT_KMS_KEY_ID: ${AEGIS_REPORT_KMS_KEY_ID:-}
      AEGIS_NOTIFICATION_ENCRYPTION_KEY: ${AEGIS_NOTIFICATION_ENCRYPTION_KEY:-}
      AEGIS_REPORT_RETENTION_DAYS: ${AEGIS_REPORT_RETENTION_DAYS:-30}
      AEGIS_REPORT_URL_SECONDS: ${AEGIS_REPORT_URL_SECONDS:-60}
      AEGIS_API_KEY_RATE_LIMIT: ${AEGIS_API_KEY_RATE_LIMIT:-120}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AEGIS_LOCAL_SECRET_KEY: ${AEGIS_LOCAL_SECRET_KEY:-}
      AEGIS_APP_ORIGIN: ${AEGIS_APP_ORIGIN:-http://localhost:5173}
      AEGIS_COOKIE_SECURE: ${AEGIS_COOKIE_SECURE:-false}
      AEGIS_ACCESS_SECONDS: ${AEGIS_ACCESS_SECONDS:-600}
      AEGIS_REFRESH_DAYS: ${AEGIS_REFRESH_DAYS:-30}
      AEGIS_RESET_MINUTES: ${AEGIS_RESET_MINUTES:-30}
      AEGIS_AUTH_RATE_LIMIT: ${AEGIS_AUTH_RATE_LIMIT:-10}
      AEGIS_SMTP_HOST: ${AEGIS_SMTP_HOST:-}
      AEGIS_SMTP_PORT: ${AEGIS_SMTP_PORT:-587}
      AEGIS_SMTP_USERNAME: ${AEGIS_SMTP_USERNAME:-}
      AEGIS_SMTP_PASSWORD: ${AEGIS_SMTP_PASSWORD:-}
      AEGIS_SMTP_SENDER: ${AEGIS_SMTP_SENDER:-noreply@localhost}
      AEGIS_SMTP_STARTTLS: ${AEGIS_SMTP_STARTTLS:-true}
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:?Run make setup first}@postgres:5432/aegis
      AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD:?Run make setup first}@redis:6379/0
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-INFO}
    volumes: [report_data:/var/lib/aegis/reports]
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [frontend, database, api_broker]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    environment:
      AEGIS_PROFILE: ${AEGIS_PROFILE:-dev}
      AEGIS_DEMO_MODE: ${AEGIS_DEMO_MODE:-false}
      AEGIS_SCANNER_PROVIDER: ${AEGIS_SCANNER_PROVIDER:-none}
      AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD:?Run make setup first}@redis:6379/0
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-INFO}
    depends_on:
      redis: { condition: service_healthy }
    networks: [worker_broker]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A aegis_api.worker:app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make setup first}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis_data:/data]
    networks: [api_broker, worker_broker]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.path=/prometheus',
      ]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  grafana:
    image: grafana/grafana:13.2.1
    volumes:
      - ./infra/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [observability]
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: [scanner]
    # Idle foundation container: no daemon, target, scan or API port.
    command: ['sleep', 'infinity']
    network_mode: none
    volumes: [zap_data:/zap/wrk]
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  report_data:
  postgres_data:
  redis_data:
  zap_data:
  prometheus_data:
  grafana_data:
networks:
  observability:
    internal: true
  frontend:
  database:
    internal: true
  api_broker:
    internal: true
  worker_broker:
    internal: true
