# Production-shaped local verification, not the Phase 11 deployment.
services:
  web:
    build:
      target: production
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
        VITE_SECURITY_CONTACT: ${VITE_SECURITY_CONTACT:-}
    volumes: !reset []
    ports: !override ['127.0.0.1:8080:8080']
    environment: !reset {}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
  api:
    environment:
      AEGIS_PROFILE: prod
    ports: !reset []
  worker:
    environment:
      AEGIS_PROFILE: prod
