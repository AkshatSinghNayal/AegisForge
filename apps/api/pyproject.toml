[project]
name = "aegis-api"
version = "0.1.0"
description = "AegisForge API foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2,<3",
    "alembic",
    "asyncpg",
    "redis",
    "celery",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.1",
    "pyyaml>=6.0.3",
    "openapi-spec-validator>=0.9.0",
    "google-genai<3",
    "reportlab>=5.0.1",
    "boto3>=1.43.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_api"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "pyyaml",
    "types-pyyaml>=6.0.12.20260906",
    "pypdf>=6.18.1",
    "types-reportlab>=5.0.0.20260911",
    "boto3-stubs[s3]>=1.43.93",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires actual PostgreSQL and Redis", "zap_live: opt-in real ZAP against internal fixture only"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
