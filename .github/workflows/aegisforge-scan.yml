name: AegisForge scan
on:
  workflow_call:
    inputs:
      trusted-ref:
        description: Reviewed full commit SHA in the caller repository containing scripts/aegisforge_ci.py
        type: string
        required: true
      api-url:
        type: string
        required: true
      app-url:
        type: string
        required: true
      project:
        type: string
        required: true
      target:
        type: string
        required: true
      policy:
        description: Registered passive scanner policy UUID; active project gate is frozen at submission
        type: string
        required: true
      commit:
        type: string
        required: true
      branch:
        type: string
        required: true
      pull-request:
        type: number
        default: 0
      environment:
        type: string
        required: true
      timeout:
        type: number
        default: 900
      poll-interval:
        type: number
        default: 5
      warn-exit:
        type: number
        default: 2
      fail-exit:
        type: number
        default: 1
      incomplete-exit:
        type: number
        default: 3
      pr-comment:
        type: boolean
        default: false
    secrets:
      AEGISFORGE_API_KEY:
        required: true
permissions: {}
# Serialize the same target/PR so two comment writers cannot create duplicates.
concurrency:
  group: aegisforge-${{ github.repository }}-${{ inputs.target }}-${{ inputs.pull-request || inputs.branch }}
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      AEGISFORGE_API_URL: ${{ inputs.api-url }}
      AEGISFORGE_APP_URL: ${{ inputs.app-url }}
      AEGISFORGE_PROJECT: ${{ inputs.project }}
      AEGISFORGE_TARGET: ${{ inputs.target }}
      AEGISFORGE_POLICY: ${{ inputs.policy }}
      AEGISFORGE_COMMIT: ${{ inputs.commit }}
      AEGISFORGE_BRANCH: ${{ inputs.branch }}
      AEGISFORGE_PULL_REQUEST: ${{ inputs.pull-request }}
      AEGISFORGE_ENVIRONMENT: ${{ inputs.environment }}
      AEGISFORGE_TIMEOUT: ${{ inputs.timeout }}
      AEGISFORGE_POLL_INTERVAL: ${{ inputs.poll-interval }}
      AEGISFORGE_WARN_EXIT: ${{ inputs.warn-exit }}
      AEGISFORGE_FAIL_EXIT: ${{ inputs.fail-exit }}
      AEGISFORGE_INCOMPLETE_EXIT: ${{ inputs.incomplete-exit }}
    steps:
      - name: Validate trusted script revision
        env:
          TRUSTED_REF: ${{ inputs.trusted-ref }}
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-fA-F]{40}", os.environ["TRUSTED_REF"]), "Full trusted SHA required"'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.trusted-ref }}
          persist-credentials: false
          sparse-checkout: scripts/aegisforge_ci.py
          sparse-checkout-cone-mode: false
      - name: Run authorized passive scan
        env:
          AEGISFORGE_API_KEY: ${{ secrets.AEGISFORGE_API_KEY }}
        run: python3 scripts/aegisforge_ci.py
      - name: Retain redacted result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegisforge-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
          path: aegisforge-summary.json
          if-no-files-found: error
          retention-days: 7
  comment:
    needs: scan
    if: always() && !cancelled() && inputs.pr-comment && inputs.pull-request > 0 && needs.scan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Validate trusted script revision
        env:
          TRUSTED_REF: ${{ inputs.trusted-ref }}
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-fA-F]{40}", os.environ["TRUSTED_REF"]), "Full trusted SHA required"'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.trusted-ref }}
          persist-credentials: false
          sparse-checkout: scripts/aegisforge_ci.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aegisforge-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
      - name: Update redacted PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AEGISFORGE_APP_URL: ${{ inputs.app-url }}
          AEGISFORGE_PROJECT: ${{ inputs.project }}
          AEGISFORGE_TARGET: ${{ inputs.target }}
          AEGISFORGE_PULL_REQUEST: ${{ inputs.pull-request }}
        run: python3 scripts/aegisforge_ci.py --comment-only
