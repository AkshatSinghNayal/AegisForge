name: Foundation quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: make setup
      - run: pnpm --filter @aegisforge/web exec playwright install --with-deps chromium
      - run: pnpm check
      - run: make build test-e2e compose-config
      - run: make test-auth-e2e
      - run: make dev migrate test-integration
      - run: make migrate
      - run: docker compose -p aegisforge -f docker-compose.yml -f docker-compose.prod.yml build
      - run: docker compose -p aegisforge -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
        env:
          AEGIS_APP_ORIGIN: https://localhost:8080
      - run: curl --fail http://localhost:8080/health/ready
      - if: always()
        run: make down
