server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /health/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
