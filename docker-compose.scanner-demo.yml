# Run this file ON THE SCANNER DAEMON. No host ports or infrastructure networks.
name: aegis-scanner-demo
services:
  training:
    image: python:3.12.14-slim
    profiles: [scanner-demo]
    command: ['python', '/fixture.py']
    volumes: ['./infra/scanner/fixture.py:/fixture.py:ro']
    read_only: true
    tmpfs: ['/tmp:size=16m']
    networks:
      fixture:
        ipv4_address: 172.30.88.10
    user: '10001:10001'
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
networks:
  fixture:
    name: aegis-scanner-fixture
    internal: true
    ipam:
      config: [{ subnet: 172.30.88.0/24 }]
